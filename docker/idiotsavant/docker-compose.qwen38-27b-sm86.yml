# vllm-idiotsavant serving qwen3.8_27b_idiotSavant_sm_86 with its DFlash2 drafter
# on 2x RTX 3090 (sm_86), tensor parallel 2.
#
#   https://huggingface.co/BlairQ/qwen3.8_27b_idiotSavant_sm_86
#   https://huggingface.co/BlairQ/qwen3.8_27b_idiotSavant_sm_86_dflash2
#
# Put this file and qwen-froggeric-chat-template.jinja in a folder and run (optionally with a .env,
# see .env.example; the default API key is "idiotsavantftw"). The first start downloads the model
# and the drafter from Hugging Face (~20 GB) into ./models:
#
#   docker compose -f docker-compose.qwen38-27b-sm86.yml up -d
#
# Paths, port and memory limit come from the .env. To attach the server to an existing Docker
# network with a fixed IP or pin it to CPUs, add docker-compose.network.yml on top of this file.
#
# The first start compiles torch.compile graphs and the PTX kernels (several minutes); they are
# cached in CACHE_DIR. To clear the caches (with the server stopped):
#
#   docker compose -f docker-compose.qwen38-27b-sm86.yml run --rm clear-caches

services:
  vllm-server:
    image: ${VLLM_IDIOTSAVANT_IMAGE:-ghcr.io/blairq/vllm-idiotsavant:v0.29.0-idiotsavant.1}
    container_name: vllm-idiotsavant-27b
    # No swap. 26 GB covers the 8 GiB RAM KV tier (L2); the host needs ~32 GB of RAM.
    mem_limit: ${MEM_LIMIT:-26g}
    memswap_limit: ${MEM_LIMIT:-26g}
    ports:
      - "${PORT:-8000}:8320"
    volumes:
      - ${MODELS_DIR:-./models}:/root/.cache/huggingface        # Hugging Face cache (model and drafter)
      - ${KV_DISK_DIR:-./kv-offload}:/kv-offload                # only used if the disk KV tier is enabled
      - &cache_vllm ${CACHE_DIR:-./cache}/vllm:/root/.cache/vllm
      - &cache_torch ${CACHE_DIR:-./cache}/torch:/root/.cache/torch
      - &cache_triton ${CACHE_DIR:-./cache}/triton:/root/.cache/triton
      - &cache_inductor ${CACHE_DIR:-./cache}/torchinductor:/root/.cache/torchinductor
      - ./qwen-froggeric-chat-template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    environment:
      - VLLM_MARLIN_INPUT_DTYPE=int8             # W4A8: int8 activations (without it the model runs W4A16)
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - VLLM_SERVER_DEV_MODE=0
      # On a GPU exception, dump the faulting kernel for cuda-gdb (no cost otherwise).
      - CUDA_ENABLE_COREDUMP_ON_EXCEPTION=${CUDA_COREDUMP:-1}
      - CUDA_ENABLE_LIGHTWEIGHT_COREDUMP=1
      - CUDA_COREDUMP_FILE=/root/.cache/vllm/idiotsavant/volcados/gpu_core_%p_%t.nvcudmp
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD=1024
      - VLLM_USE_FUSED_MOE_GROUPED_TOPK=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=0
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - CUDA_DEVICE_SCHEDULE=1
      - OMP_NUM_THREADS=1
      - PYTHONHASHSEED=0
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      - VLLM_API_KEY=${VLLM_API_KEY:-idiotsavantftw}   # default key if .env does not set one
      - VLLM_ADMIN_API_KEY=${VLLM_ADMIN_API_KEY:-}   # admin routes; empty = VLLM_API_KEY
      - HF_TOKEN=${HF_TOKEN:-}
    # Healthy means it actually generates, not just that /health answers.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          n=$$(curl -sf -m 120 http://localhost:8320/v1/completions
          -H 'Content-Type: application/json'
          -H "Authorization: Bearer $${VLLM_API_KEY}"
          -d '{"model":"qwen3.8","prompt":"The capital of France is","max_tokens":16,"temperature":0}'
          | python3 -c "import sys,json;print(json.load(sys.stdin)['usage']['completion_tokens'])"
          2>/dev/null) && [ "$${n:-0}" -gt 5 ]
      interval: 60s
      timeout: 130s
      retries: 2
      start_period: 3600s
    restart: unless-stopped
    shm_size: "16gb"
    ipc: host
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - ${MODEL:-BlairQ/qwen3.8_27b_idiotSavant_sm_86}   # downloaded on first start into MODELS_DIR
      - --served-model-name
      - qwen3.8_27b_idiotSavant_sm_86
      - qwen3.8
      - qwen3.8-27b-uncensored
      - qwen3.6
      - --disable-access-log-for-endpoints
      - "/metrics,/health"
      - --enable-prompt-tokens-details
      - --trust-remote-code
      - --attention-backend
      - TRITON_ATTN                    # the integer attention decode runs on this backend
      - --moe-backend
      - flashinfer_trtllm
      - --generation-config
      - vllm
      - --quantization
      - compressed-tensors
      - --chat-template
      - /etc/qwen-froggeric-chat-template.jinja
      - --dtype
      - float16
      - --mamba-ssm-cache-dtype
      - "float16"
      - --kv-cache-dtype
      - "int8_per_token_head"          # int8 KV: with the rotated residual, better quality than fp8
      - --max-num-seqs
      - "11"
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "${GPU_UTIL:-0.95}"
      # Images: at most 32 per conversation and 2 per turn (older ones are already cached;
      # extra images in a turn are replaced by a text note instead of failing the request).
      - --limit-mm-per-prompt
      - '{"image":${MAX_IMAGES:-32},"video":0}'
      - --limit-mm-per-turn
      - "2"
      - --mm-processor-kwargs
      - '{"max_pixels":2000000,"min_pixels":65536}'
      - --mm-processor-cache-gb
      - "1"
      - --enable-flashinfer-autotune
      - --reasoning-parser
      - qwen3
      - --reasoning-force-close        # a turn that ends without </think> is closed and answered
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-cumem-allocator
      # KV offload to a RAM tier (L2, 8 GiB, ARC eviction). No disk tier: to add one, put
      #   {"type": "fs", "root_dir": "/kv-offload", "max_size_gb": 20, "orphan_max_age_days": 3}
      # in "secondary_tiers". "agents" lists the agent labels kept in the metrics.
      - --kv-transfer-config
      - '{"kv_connector": "OffloadingConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"spec_name": "TieringOffloadingSpec", "cpu_bytes_to_use": ${KV_RAM_BYTES:-8589934592}, "eviction_policy": "arc", "store_threshold": 1, "secondary_tiers": [], "agents": ["coach", "primary", "primary_low", "primary_high", "primary_nothink", "planner", "planner_nothink", "coder", "verifier", "utility", "explorer", "vision", "art"]}}'
      - --enable-prefix-caching
      # Sparse GDN state checkpoints in the prefix cache (one every 16 blocks plus each prompt's end).
      - --prefix-cache-retention-interval
      - "14080"
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "8192"
      # Dynamic prefill chunk: 2640 tokens when nobody is decoding, 880 when someone is.
      - --long-prefill-token-threshold
      - "2640"
      - --long-prefill-token-threshold-with-decode
      - "880"
      # Admission: one prefill at a time, except short prompts and turns mostly served from the
      # prefix cache; never commit more than 90% of the KV cache.
      - --max-concurrent-prefills
      - "1"
      - --short-prompt-bypass-tokens
      - "2000"
      - --remaining-prefill-bypass-tokens
      - "8192"
      - --kv-admission-headroom
      - "0.10"
      - --kv-admission-min-concurrency
      - "2"
      - --performance-mode
      - "throughput"
      - --cudagraph-capture-sizes
      - "4"
      - "8"
      - "12"
      - "16"
      - "20"
      - "24"
      - "28"
      - "32"
      - "36"
      - "40"
      - --async-scheduling
      - --scheduling-policy
      - priority
      # DFlash2 drafter tuned for this model, K=8:
      #   tree_drafting        8-node tree instead of a chain
      #   draft_vocab_size     drafts over the 64k most frequent tokens
      #   draft_residual_scale keeps the drafter's residual stream within fp16
      # DCOCO corrector: DRAFT_MODEL=BlairQ/qwen3.8_27b_idiotSavant_sm_86_dflash2_dcoco picks it up on its own
      # (the checkpoint ships the head); add "dcoco":false to drop it, "dcoco":true to require it.
      - --speculative-config
      - '{"method":"dflash","model":"${DRAFT_MODEL:-BlairQ/qwen3.8_27b_idiotSavant_sm_86_dflash2}","num_speculative_tokens":8,"tree_drafting":true,"draft_vocab_size":65536,"draft_residual_scale":32}'
      - --host
      - "0.0.0.0"
      - --port
      - "8320"
      - --api-key
      - "${VLLM_API_KEY:-idiotsavantftw}"

  # One-off service (not started by `up`): clears torch.compile, Inductor, Triton and PTX caches.
  clear-caches:
    image: ${VLLM_IDIOTSAVANT_IMAGE:-ghcr.io/blairq/vllm-idiotsavant:v0.29.0-idiotsavant.1}
    profiles: [maintenance]
    network_mode: none
    volumes:
      - *cache_vllm
      - *cache_torch
      - *cache_triton
      - *cache_inductor
    entrypoint: ["sh", "-euc"]
    command:
      - |
        du -sh /root/.cache/vllm /root/.cache/torch /root/.cache/triton /root/.cache/torchinductor
        find /root/.cache/torch /root/.cache/triton /root/.cache/torchinductor -mindepth 1 -delete
        find /root/.cache/vllm -mindepth 1 -maxdepth 1 ! -name idiotsavant -exec rm -rf {} +
        rm -rf /root/.cache/vllm/idiotsavant/ptx
        echo "caches cleared"
        du -sh /root/.cache/vllm /root/.cache/torch /root/.cache/triton /root/.cache/torchinductor
